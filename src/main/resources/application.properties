spring.application.name=demo
springdoc.swagger-ui.url=/openapi.yml
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:replace-this-placeholder-with-a-secret-of-at-least-32-characters}}
app.jwt.expiration-ms=86400000
spring.profiles.active=${SPRING_PROFILES_ACTIVE:seed}
server.port=${PORT:8080}
server.ssl.enabled=false
max.pagination.size=100
